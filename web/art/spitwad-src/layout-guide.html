<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="1024" height="1536"></canvas><script>
const CLEAN = location.hash === '#clean', PL = 16, CAM_Y = 4 * PL, PITCH = -10 * Math.PI / 180, VFOV = 50 * Math.PI / 180, W = 1024, H = 1536, F = (H / 2) / Math.tan(VFOV / 2);

}
function shade(hex, k) { const n = parseInt(hex.slice(1), 16), r = Math.min(255, (n >> 16) * k), gg = Math.min(255, ((n >> 8) & 255) * k), b = Math.min(255, (n & 255) * k); return `rgb(${r|0},${gg|0},${b|0})`; }
function label(n, x, y, z) { if (CLEAN) return; const p = proj(x, y, z); g.fillStyle = '#111'; g.beginPath(); g.arc(p.x, p.y, 19, 0, 7); g.fill(); g.strokeStyle = '#ffd27a'; g.lineWidth = 3; g.stroke(); g.fillStyle = '#ffd27a'; g.font = '800 20px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(n, p.x, p.y + 1); }
