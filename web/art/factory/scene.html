<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omni Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&family=Cinzel:wght@700;900&family=Nunito:wght@600;800&display=swap">
<style>
/* One screen: the factory fills the window; demo controls float at the bottom. Dark by design. */
:root { --bg: #1e2530; --ink: #f3e9dc; --muted: #b9ab9a; --ember: #ff7a2e; --brass: #d8a64a; --panel: rgba(24,18,14,.92); color-scheme: dark }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: Nunito, system-ui, sans-serif; overflow: hidden }
[hidden] { display: none !important }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block }
.bar { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 8px; align-items: center; background: var(--panel); border: 1px solid #4a3828; border-radius: 14px; padding: 8px 10px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px) }
.bar button { font: 800 14px Nunito, sans-serif; color: #1b120b; background: var(--brass); border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer }
.bar button.alt { background: #3a2c20; color: var(--ink) }
.bar button:focus-visible, .card button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px }
.bar span { color: var(--muted); font-size: 13px; padding: 0 6px }
.tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid #6b4a2a; color: var(--ink); font: 800 14px Nunito, sans-serif; padding: 6px 10px; border-radius: 8px; transform: translate(-50%, -130%); white-space: nowrap }
.toast { position: fixed; right: 16px; top: 16px; background: var(--panel); border: 1px solid #6b4a2a; color: var(--brass); font: 800 15px Nunito, sans-serif; padding: 8px 14px; border-radius: 10px; transition: opacity .4s, transform .4s; opacity: 0; transform: translateY(-8px) }
.toast.on { opacity: 1; transform: none }
.modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.55); padding: 16px }
.card { background: var(--panel); border: 1px solid #6b4a2a; border-radius: 16px; padding: 22px; max-width: 420px; width: 100%; display: grid; gap: 10px; box-sizing: border-box }
.card h2 { font: 900 24px Cinzel, serif; margin: 0; color: var(--brass); letter-spacing: .03em }
.card p { margin: 0; color: var(--muted); line-height: 1.5 }
.card button { justify-self: start; font: 800 14px Nunito, sans-serif; background: var(--brass); color: #1b120b; border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer }
</style>

<canvas id="c" aria-label="The Omni forge: a fire-powered machine that prints card packs"></canvas>
<div class="bar" role="group" aria-label="Demo">
  <button id="b1" type="button">Buy 1 pack</button>
  <button id="b5" type="button">Buy 5</button>
  <button id="burn" class="alt" type="button">Burn a card</button>
  <button id="auto" class="alt" type="button" aria-pressed="false">Auto demo</button>
  <button id="fin" class="alt" type="button">Sold-out show</button>
  <span id="st">Fire #7 · 117 left</span>
</div>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" role="status"></div>
<div id="modal" class="modal" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt"></h2><p id="mp"></p><button id="mc" type="button">Close</button></div></div>

<script>
(async () => {
const SW = 3840, SH = 2160, A = 'build3/';
const G = await (await fetch(A + 'scene.json')).json();
const load = (n) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = A + n + '.webp'; });
const names = ['plate', 'belt', 'chain-up', 'chain-lo', 'front-stand', 'roll-0', 'roll-1', 'pack', 's-flywheel', 's-gear-big-a', 's-gear-big-b',
  's-gear-small', 's-pulley', 's-rod', 's-conrod', 's-capsule', 's-padlock', 's-token', 's-log0', 's-log1', 's-log2', 's-paper0', 's-paper1', 's-paper2', 'card'];
const img = {}; (await Promise.all(names.map(load))).forEach((im, k) => img[names[k]] = im);
const logs = [img['s-log0'], img['s-log1'], img['s-log2']], papers = [img['s-paper0'], img['s-paper1'], img['s-paper2']];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let dpr = 1, scale = 1, ox = 0, oy = 0;
function fit() {
  dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  scale = Math.min(cv.width / SW, cv.height / SH);
  ox = (cv.width - SW * scale) / 2; oy = (cv.height - SH * scale) / 2;
}
addEventListener('resize', fit); fit();

// ---------- the flame: the site's WebGL fire on its own small canvas
const FRAG = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform float uT, uS, uF;
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;} vec2 mod289(vec2 x){return x-floor(x*(1./289.))*289.;}
vec3 permute(vec3 x){return mod289(((x*34.)+1.)*x);}
float snoise(vec2 v){ const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);
 vec2 i=floor(v+dot(v,C.yy)); vec2 x0=v-i+dot(i,C.xx); vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);
 vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1; i=mod289(i);
 vec3 p=permute(permute(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));
 vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.); m=m*m; m=m*m;
 vec3 x=2.*fract(p*C.www)-1.; vec3 h=abs(x)-.5; vec3 ox=floor(x+.5); vec3 a0=x-ox;
 m*=1.79284291400159-.85373472095314*(a0*a0+h*h);
 vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw; return 130.*dot(m,g); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*snoise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
void main(){
  float s=uS, s3=s*s*s, t=uT;
  vec2 p=vec2(vUv.x-0.5, vUv.y-0.04)*vec2(1.0,1.15);
  float H=0.2+0.28*s+0.75*s3, W=0.14+0.17*s+0.05*s3;
  vec2 q=vec2(p.x/W, p.y/H);
  vec2 wq=vec2(p.x*6.5, p.y*4.2);
  float n=fbm(vec2(wq.x*0.5, wq.y*0.45-t*1.25));
  float n2=fbm(vec2(wq.x*0.95+n*0.8, wq.y*0.95-t*2.1+n*0.6));
  float qx=q.x+(0.2+0.45*s*s)*n*max(q.y,0.);
  float taper=1.7-0.9*s3;
  float env=clamp(1.0-qx*qx*(0.85+max(q.y,0.)*taper),0.,1.)*clamp(1.0-q.y*(0.8-0.15*s3),0.,1.)*smoothstep(-0.3,0.05,q.y);
  float I=env*(1.2+(0.8+0.3*s3)*n2)-0.14*max(q.y,0.);
  I=clamp(I,0.,1.); I=pow(I,1.3)*uF;
  vec3 c=mix(vec3(.5,.08,.02), vec3(1.,.42,.08), smoothstep(.08,.38,I));
  c=mix(c, vec3(1.,.78,.32), smoothstep(.34,.62,I)); c=mix(c, vec3(1.,.97,.86), smoothstep(.62,.92,I));
  float a=smoothstep(0.05,0.45,I)*smoothstep(-0.07,-0.015,p.y);
  o=vec4(c*a,a);
}`;
function flameCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const gl = c.getContext('webgl2', { premultipliedAlpha: true, alpha: true, preserveDrawingBuffer: true });
  if (!gl) return null;
  const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); return x; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, `#version 300 es
in vec2 a; out vec2 vUv; void main(){ vUv=a*0.5+0.5; gl_Position=vec4(a,0.,1.); }`));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return null;
  gl.useProgram(pr);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uT = gl.getUniformLocation(pr, 'uT'), uS = gl.getUniformLocation(pr, 'uS'), uF = gl.getUniformLocation(pr, 'uF');
  return { c, draw(t, s, f) { gl.viewport(0, 0, w, h); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uT, t); gl.uniform1f(uS, s); gl.uniform1f(uF, f); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); } };
}
const fire = flameCanvas(420, 360), ash = flameCanvas(300, 260);
const FB_X = 380, FB_Y = 560, fireBuf = document.createElement('canvas'); fireBuf.width = 500; fireBuf.height = 500; // the furnace's flames, scene px

// ---------- places (scene pixels, measured on the master)
const FIREBOX = { x0: 402, x1: 852, cx: 627, archY: 800, archRy: 84, base: 1046, flameX: 630, flameY: 1004 };
const ASHBIN = [[70, 1100], [497, 1092], [425, 1277], [95, 1238]]; // inside the bin, down to the front rim
const DIAL_HOOD = [695, 455, 41], DIAL_ASH = [393, 1355, 36];
const BOARD = { x: 2656, y: 432, w: 176, h: 198 };
const TUBE = [[3560, 860], [3590, 629], [3590, 432], [3623, 239], [3650, -60]];
const WINDOWS = [[3590, 629, 31], [3590, 432, 31], [3623, 239, 31]];
const PACK_FROM = 2296, PACK_TO = 3412, PACK_Y = 1003;
const LANTERNS = [[235, 465], [40, 790], [3375, 300]];
const PADLOCK = [1290, 1528];

// ---------- state
const TOTAL = 117;
let left = TOTAL, queue = 0, ready = [], burned = 12, credits = 0;
if (location.search.includes('sold')) left = 0;
if (location.search.includes('finale')) left = 2; // preview the sold-out show
let speed = 0.15, target = 0.15;
let wheelA = +(new URLSearchParams(location.search).get("wheel") || 0), beltX = 0, chainX = 0, rollS = 0, ft = 0, at = 0, flare = 0, stamp = 0;
const items = [], packs = [], caps = [], tokens = [];
let nextPackAt = 0, now = 0, lockFall = left > 0 ? -1 : 1;
const st = document.getElementById('st'), toastEl = document.getElementById('toast');
const status = () => st.textContent = left > 0 ? `Fire #7 · ${left} left` : 'Fire #7 · SOLD OUT';
let toastT = 0;
function toast(t) { toastEl.textContent = t; toastEl.classList.add('on'); toastT = now + 2.2; }

function buy(n) {
  n = Math.min(n, left - queue); if (n <= 0) return;
  for (let k = 0; k < n; k++) {
    const t0 = now + k * 0.6;
    items.push({ kind: 'log', t0, img: logs[k % 3], dx: -90 + Math.random() * 120, rot: (Math.random() - .5) * .6, spin: (Math.random() - .5) * 1.4 });
    items.push({ kind: 'log', t0: t0 + 0.18, img: logs[(k + 1) % 3], dx: -10 + Math.random() * 120, rot: (Math.random() - .5) * .6, spin: (Math.random() - .5) * 1.4 });
    items.push({ kind: 'paper', t0: t0 + 0.05, img: papers[k % 3], dx: -60 + Math.random() * 120, rot: (Math.random() - .5) * .5, spin: (Math.random() - .5) * 1.2 });
  }
  queue += n;
  for (let k = 0; k < n; k++) ready.push(now + k * 0.6 + 1.8); // a pack once its logs are in
}
const cardsIn = []; let ashFlare = 0;
function burn() { cardsIn.push({ t0: now, rot: Math.random() * 0.6 - 0.3 }); }
function cardLanded() {
  ashFlare = 1.6; sparkBurst(300, 1170, 22, 0.8);
  burned++; if (burned % 42 === 0) { credits++; tokens.push({ t0: now }); } else toast(`Burned ${burned % 42} / 42.0`);
}
function drawCards() { // from the open bench, an arc into the ash bin's fire
  const im = img.card;
  for (let i = cardsIn.length - 1; i >= 0; i--) {
    const c = cardsIn[i], t = (now - c.t0) / 1.0;
    if (t >= 1) { cardsIn.splice(i, 1); cardLanded(); continue; }
    const x = 1250 + (300 - 1250) * t, y = 1470 + (1190 - 1470) * t - 520 * Math.sin(Math.PI * t), sc = 1.2 - 0.25 * t;
    ctx.save();
    if (t > 0.75) { ctx.beginPath(); ctx.rect(0, 0, 900, 1185 + (1 - t) * 400); ctx.clip(); } // sinks into the coals
    ctx.translate(x, y); ctx.rotate(c.rot + t * 5.5); ctx.scale(sc * Math.cos(t * 9), sc);
    ctx.fillStyle = '#2a1d14'; ctx.fillRect(-im.width * 0.38, -im.height * 0.38, im.width * 0.76, im.height * 0.76);
    ctx.drawImage(im, -im.width / 2, -im.height / 2);
    if (t > 0.6) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,120,30,${(t - 0.6) * 1.6})`; ctx.fillRect(-im.width / 2, -im.height / 2, im.width, im.height); }
    ctx.restore();
  }
}
document.getElementById('b1').onclick = () => buy(1);
document.getElementById('b5').onclick = () => buy(5);
document.getElementById('burn').onclick = burn;
document.getElementById('fin').onclick = () => { if (left <= 0) { location.reload(); return; } if (queue === 0) { left = 2; status(); buy(2); } };
let auto = false, autoNext = 0;
const autoBtn = document.getElementById('auto');
autoBtn.onclick = () => { auto = !auto; autoBtn.setAttribute('aria-pressed', auto); autoBtn.textContent = auto ? 'Stop demo' : 'Auto demo'; autoNext = now; };

// ---------- helpers
function packAt(x, y, w, a = 1, flat = 0.62) {
  const h = w * 1.4 * flat;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(4, h * 0.36, w * 0.56, h * 0.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.drawImage(img.pack, -w / 2, -h / 2, w, h);
  ctx.restore();
}
function spin(im, cx, cy, a) { ctx.save(); ctx.translate(cx, cy); ctx.rotate(a); ctx.drawImage(im, -im.width / 2, -im.height / 2); ctx.restore(); }
function chalk(text, x, y, size, w, alpha = 0.88) {
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let s = size; ctx.font = `700 ${s}px "Cabin Sketch", cursive`;
  while (ctx.measureText(text).width > w && s > 8) { s -= 1; ctx.font = `700 ${s}px "Cabin Sketch", cursive`; }
  ctx.fillStyle = `rgba(240,236,224,${alpha})`; ctx.shadowColor = 'rgba(255,255,255,.25)'; ctx.shadowBlur = 3;
  ctx.fillText(text, x, y); ctx.restore();
}
function dialText(text, x, y, size, color = '#3b2412') {
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 ${size}px Cinzel, serif`;
  ctx.fillStyle = 'rgba(255,236,190,.5)'; ctx.fillText(text, x + 1, y + 1.5); ctx.fillStyle = color; ctx.fillText(text, x, y); ctx.restore();
}
const along = (pts, u) => { // u 0..1 along a polyline -> [x, y, angle]
  const seg = []; let tot = 0;
  for (let i = 0; i < pts.length - 1; i++) { const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); seg.push(l); tot += l; }
  let d = u * tot;
  for (let i = 0; i < seg.length; i++) {
    if (d <= seg[i] || i === seg.length - 1) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], f = Math.min(1, d / seg[i]);
      return [x0 + (x1 - x0) * f, y0 + (y1 - y0) * f, Math.atan2(y1 - y0, x1 - x0)]; }
    d -= seg[i];
  }
};

// ---------- hotspots
const HOT = [
  ['buy', [380, 560, 1080, 1100], 'Buy packs', 'Feed the fire: $2.50 + 1 PAPER a pack, in PLANK, ETH or USDG. The first 24 hours are for press holders and PLANK holders. Your pack goes straight to your wallet; you can open it once the Fire closes.'],
  ['burn', [60, 1080, 570, 1470], 'Ash bin', 'Burn cards you don’t want. Every 42.0 burned earns a free pack credit.'],
  ['open', [960, 1380, 1810, 1720], 'Open packs', 'Your sealed packs wait here, padlocked until the Fire closes. Then open them and watch your 6 cards come out.'],
  ['grade', [2000, 1260, 2780, 1720], 'PSA grading', 'Reveal a card’s grade, 1 to 10, for the most whole PAPER under $0.25.'],
  ['suggest', [3460, 1180, 3740, 1770], 'Suggest a character', '1 PAPER. The next Fire’s characters are picked from these; a picked suggestion earns a free pack.'],
  ['board', [2636, 412, 2852, 650], 'This Fire', 'Fire #7. Packs left, and who can buy right now.'],
].map(([k, r, title, text]) => ({ k, r, title, text }));
let hover = null;
const tip = document.getElementById('tip');
function toScene(ev) { const r = cv.getBoundingClientRect(); return [((ev.clientX - r.left) * dpr - ox) / scale, ((ev.clientY - r.top) * dpr - oy) / scale]; }
cv.addEventListener('pointermove', (ev) => {
  const [x, y] = toScene(ev);
  hover = HOT.find((h) => x >= h.r[0] && x <= h.r[2] && y >= h.r[1] && y <= h.r[3]) || null;
  cv.style.cursor = hover ? 'pointer' : 'default';
  if (hover) { tip.hidden = false; tip.textContent = hover.title; tip.style.left = ev.clientX + 'px'; tip.style.top = ev.clientY + 'px'; } else tip.hidden = true;
});
cv.addEventListener('pointerleave', () => { hover = null; tip.hidden = true; });
const modal = document.getElementById('modal');
cv.addEventListener('click', (ev) => { const [x, y] = toScene(ev); const h = HOT.find((h) => x >= h.r[0] && x <= h.r[2] && y >= h.r[1] && y <= h.r[3]);
  if (!h) return; document.getElementById('mt').textContent = h.title; document.getElementById('mp').textContent = h.text; modal.hidden = false; document.getElementById('mc').focus(); });
document.getElementById('mc').onclick = () => modal.hidden = true;
modal.addEventListener('click', (e) => { if (e.target === modal) modal.hidden = true; });
addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.hidden = true; });

// ---------- drawing pieces
function drawRolls() { // the print on the rollers turns; drawn as a multiply layer, row by row around the cylinder
  ctx.save(); ctx.globalCompositeOperation = 'multiply';
  G.rolls.forEach((r, i) => {
    const im = img['roll-' + i], P = r.period;
    for (let y = 0; y < r.h; y++) {
      const s = r.r * Math.asin(Math.max(-0.999, Math.min(0.999, (y + 0.5 - r.r) / r.r)));
      let ty = ((s + r.r * Math.PI / 2 - rollS) % P + P) % P; // texture row
      ctx.drawImage(im, 0, Math.floor(ty), r.w, 1, r.x, r.y + y, r.w, 1.02);
    }
  });
  ctx.restore();
}
function drawBelt() {
  const b = G.belt, off = beltX % b.period;
  ctx.save(); ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
  ctx.drawImage(img.belt, 0, 0, b.period * 2, b.h, b.x + off - b.period * 2, b.y, b.period * 2, b.h);
  ctx.restore();
}
function drawChain() { // each strand slides along itself (the loop: top goes one way, bottom the other)
  for (const [k, dir] of [['up', 1], ['lo', -1]]) {
    const c = G.chain[k], im = img['chain-' + k], [ax, ay] = c.a, [bx, by] = c.b;
    const L = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / L, uy = (by - ay) / L, vx = -uy, vy = ux;
    const off = ((chainX * dir) % c.period + c.period) % c.period;
    ctx.save(); ctx.beginPath();
    ctx.moveTo(ax - vx * 10, ay - vy * 10); ctx.lineTo(bx - vx * 10, by - vy * 10); ctx.lineTo(bx + vx * 10, by + vy * 10); ctx.lineTo(ax + vx * 10, ay + vy * 10); ctx.closePath(); ctx.clip();
    ctx.drawImage(im, c.pos[0] + ux * off, c.pos[1] + uy * off);
    ctx.drawImage(im, c.pos[0] + ux * (off - c.period), c.pos[1] + uy * (off - c.period));
    ctx.restore();
  }
}
function drawEngine() {
  const F = G.fly, ga = wheelA * 1.35;
  for (const [cx, cy] of G.pulleys) spin(img['s-pulley'], cx, cy, beltX / 40);
  G.gears.forEach((g, i) => spin(img['s-' + g.n], g.cx, g.cy, i === 1 ? -ga * 2 + 0.1 : ga + i * 0.05));
  spin(img['s-flywheel'], F.cx, F.cy, wheelA);
  // the piston rod: rigid, slides into the cylinder's gland, pinned to the crank
  const r0 = Math.hypot(F.pin[0] - F.cx, F.pin[1] - F.cy), a0 = Math.atan2(F.pin[1] - F.cy, F.pin[0] - F.cx);
  const px = F.cx + r0 * Math.cos(a0 + wheelA), py = F.cy + r0 * Math.sin(a0 + wheelA);
  const [gx, gy] = G.gland, ang = Math.atan2(gy - py, gx - px), rod = img['s-rod'];
  ctx.save(); ctx.beginPath(); ctx.rect(gx - 4, 600, 800, 500); ctx.clip();
  ctx.translate(px, py); ctx.rotate(ang); ctx.drawImage(rod, 0, -rod.height / 2); ctx.restore();
  ctx.save(); ctx.translate(px, py); ctx.rotate(ang + Math.PI); const e = img['s-conrod']; ctx.drawImage(e, -e.width / 2 - 3, -e.height / 2); ctx.restore();
  // the stand last: the wheel, the crank and the rod all pass behind it
  ctx.drawImage(img['front-stand'], G.front.stand[0], G.front.stand[1]);
}
function drawFires(fl) {
  if (fire) {
    const fx = Math.min(1, flare / 1.6);

// ---------- effects: sparks, embers, steam, shake (code only, no new art)
const sparks = [], embers = [], puffs = [];

const PUFF = [0, 1, 2].map((seed) => { // soft noisy steam blobs, made once
  const n = document.createElement('canvas'); n.width = n.height = 10; const nc = n.getContext('2d');

const VENTS = { cyl: [1169, 712, -0.2, -1], stub: [1532, 577, 1, -0.35], cross: [1214, 330, -0.15, -1], press: [2130, 230, -0.6, -1], drum: [3560, 830, 0.1, -1] };
function steam(v, n, power = 1) {
  const [x, y, dx, dy] = VENTS[v];
  for (let k = 0; k < n * 3; k++) puffs.push({ x: x + rnd(-4, 4), y: y + rnd(-4, 4), vx: (dx + rnd(-0.25, 0.25)) * rnd(70, 140) * power, vy: (dy + rnd(-0.2, 0.2)) * rnd(70, 140) * power,

}
function stampFx() { sparkBurst(PACK_FROM, 948, 26); shake = Math.max(shake, 0.6); steam('press', 3, 0.7); steam('cross', 2, 0.8); }

  finale = now; flare = 2.4; shake = 1.6;

  for (const v of Object.keys(VENTS)) steam(v, 10, 1.6);
}
function updateFx(dt) {
  shake = Math.max(0, shake - dt * 2.2);

  const stroke = Math.floor(wheelA / Math.PI);
  if (stroke !== lastStroke) { lastStroke = stroke; if (speed > 0.3) { steam('cyl', 2, 0.6 + speed * 0.4); if (stroke % 2) steam('stub', 1, 0.6); } }
  // embers rise out of the firebox, more when it flares
