/* pills: placed in the scene, they follow it as it scales */

.pill { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; display: inline-flex; align-items: center; gap: .5em; white-space: nowrap;

.topbar { position: fixed; left: 0; right: 0; top: 0; height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-sizing: border-box;

<script>
(async () => {
const SW = 3840, SH = 2160, A = 'build3/';

  flare = Math.max(0, flare - dt * 0.7); ashFlare = Math.max(0, ashFlare - dt * 0.8); stamp = Math.max(0, stamp - dt * 1.6);
  if (toastT && now > toastT) { toastEl.classList.remove('on'); toastT = 0; }
  if (queue > 0 && now >= nextPackAt && now >= ready[0]) {
    ready.shift(); queue--; left--; packs.push({ d: 0 }); stamp = 1; nextPackAt = now + 0.8; status(); stampFx(); if (left === 0) finaleFx();
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  updateFx(dt);
  const sk = shake * shake * 7 * scale;
  ctx.setTransform(scale, 0, 0, scale, ox + rnd(-sk, sk), oy + rnd(-sk, sk));
  ctx.drawImage(img.plate, 0, 0);
  drawRolls();
  drawBelt();
  drawPacks(dt);
  drawEngine();
  const fl = left <= 0 ? 0.5 : 0.85 + 0.15 * Math.sin(now * 7.3) * Math.sin(now * 3.1) + flare * 0.35;
  drawItems();
  drawFires(fl);
  drawFx();
  drawCapsules();
  drawBoardAndDials();
  drawPadlock(dt);
  drawCards();
  drawTokens();

  window.__frames++;
  requestAnimationFrame(frame);
}
await Promise.all([document.fonts.ready, document.fonts.load("700 40px Kalam"), document.fonts.load("40px \"Russo One\"")]).catch(() => {});
status(); renderBuy();
requestAnimationFrame(frame);
if (location.hash === '#auto') autoBtn.click();
})();
