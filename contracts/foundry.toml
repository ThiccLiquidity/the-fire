[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = ["bls-solidity/=lib/bls-solidity/src/", "openzeppelin-contracts/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read", path = "./test/cards" }, { access = "read-write", path = "../deployments" }, { access = "read", path = "./series" }, { access = "read-write", path = "./safe-tx" }]
